<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MINERALIS</title>
    <script>
      // Single-Page-App fallback for GitHub Pages project site.
      // Redirects /Minerals/<route> to /Minerals/?/<route> so index.html
      // can boot the router and restore the original path.
      (function () {
        var pathSegmentsToKeep = 1; // keep "/Minerals"
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
