<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,28 95,72 50,95 5,72 5,28' fill='none' stroke='%231a2ffb' stroke-width='6'/><circle cx='50' cy='50' r='18' fill='%23f0f1fa'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MINERALS // Smart Technology & Patent Tracker for Critical Minerals</title>
    <meta name="description" content="AI & WebGL powered intelligence platform tracking Indian patents, TRL readiness, and R&D activities across 30 notified critical minerals for technology mapping, gap identification, and policy decisions." />
    
    <!-- Preload Authentic Lusion Fonts -->
    <link rel="preload" href="./fonts/Aeonik-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="./fonts/Aeonik-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="./fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <!-- Google Fonts fallback for Aeonik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restores the original route when GitHub Pages serves this file
      // via the 404.html SPA fallback (/?/<route> -> /<route>).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
