<body>
  <div id="root"></div>
  <script>
    // Restores the original route when GitHub Pages serves this file
    // via the 404.html SPA fallback (/?/<route> -> /<route>).
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&'); })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
